schema: 2
key: studio
name: Studio
version: 1.0.0
hermes_requires: ">=0.22.0"
board: {slug: studio, name: Studio, icon: "🎬", color: "#7048E8"}
section: {id: studio, name: Studio}
manager: studio
defaults: {aux_lane: aux, vision_lane: vision}
bots:
  studio:
    role: manager
    title: Studio manager
    description: "Brief to storyboard and shot list, chains the work, reviews renders, delivers to the requester"
    lane: design
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, vision, web, delegation]
    skills: {squad: [directing-studio, studio-contract], auto_load: directing-studio,
             keep: [official:creative/creative-ideation]}
    memory: true
  studio-motion:
    role: worker
    title: Studio motion
    description: "Remotion, HyperFrames, ScrollTrigger demos, three.js and Manim renders"
    lane: design
    toolsets: [file, skills, kanban, todo, terminal, vision, browser, video]
    skills:
      squad: [producing-motion, studio-contract]
      auto_load: producing-motion
      keep:
        - id: hub:skills-sh/remotion-dev/skills/remotion-best-practices
          confirm: "Remotion needs a paid company licence from 4 employees. Does your company qualify for free use?"
        - official:creative/hyperframes
        - bundled:manim-video
    plugins:
      enable:
        - disk-cleanup
        - security-guidance
        - name: hermes-video-editor
          confirm: "hermes-video-editor is PolyForm Noncommercial. Is this use non-commercial?"
    mcp: {context7: {command: npx, args: [-y, "@upstash/context7-mcp"]}}
  studio-3d:
    role: worker
    title: Studio 3D
    description: "Blender scenes, materials, lighting, Cycles and EEVEE renders, turntables, glTF"
    lane: design
    toolsets: [file, skills, kanban, todo, terminal, vision]
    skills: {squad: [rendering-3d, studio-contract], auto_load: rendering-3d}
    plugins:
      enable:
        - disk-cleanup
        - name: blender
          confirm: "The blender plugin runs arbitrary Python inside Blender. Enable it?"
    requires: {apps: [blender>=5.1, uv]}
chains:
  piece:
    - {stage: storyboard, assignee: studio, skill: directing-studio}
    - {stage: 3d, assignee: studio-3d, skill: rendering-3d, when: needs_3d}
    - {stage: motion, assignee: studio-motion, skill: producing-motion}
    - {stage: review, assignee: studio, skill: directing-studio}
asks: ["hero loop for <site>", "turntable of <model>", "status"]
