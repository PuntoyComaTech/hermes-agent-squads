schema: 2
key: marketing
name: Marketing
version: 3.0.0
hermes_requires: ">=0.22.0"
board: {slug: marketing, name: Marketing, icon: "📣", color: "#D9480F"}
section: {id: marketing, name: Marketing}
manager: marketing
defaults: {aux_lane: aux, vision_lane: vision}
bots:
  marketing:
    role: manager
    title: Marketing manager
    description: "Brand onboarding, 90-day plan, calendar, briefs, approvals and reports"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, web, vision, delegation]
    skills: {squad: [leading-marketing, brand-contract, marketing-plan], auto_load: leading-marketing,
             keep: [official:creative/social-media-content-calendar]}
    connectors: {enabled: false, suggest: [hubspot, notion]}
    memory: true
    cron:
      marketing-plan-week: {schedule: "0 8 * * 1", script: plan_week.py, agent: false}
  marketing-research:
    role: worker
    title: Marketing research
    description: "Dated market, competitor and ad-library evidence"
    lane: research
    toolsets: [file, skills, kanban, todo, web, browser]
    skills: {squad: [researching-markets, brand-contract], keep: [bundled:blocked-page-recovery]}
  marketing-creative:
    role: worker
    title: Marketing creative
    description: "Concepts, all copy and scripts; no web access"
    lane: manager
    toolsets: [file, skills, kanban, todo, vision]
    skills: {squad: [writing-copy, brand-contract], keep: [bundled:humanizer]}
  marketing-producer:
    role: worker
    title: Marketing producer
    description: "Statics, carousels, landings, emails, documents and short HyperFrames clips"
    lane: design-pro
    toolsets: [file, skills, kanban, todo, terminal, vision, image_gen, browser]
    skills: {squad: [producing-assets, brand-contract], keep: [official:creative/hyperframes]}
    plugins: {enable: [disk-cleanup, security-guidance]}
  marketing-reviewer:
    role: worker
    title: Marketing reviewer
    description: "Five lenses: brief fit, voice, claims, persuasion and format specs"
    lane: review
    toolsets: [file, skills, kanban, todo, vision, delegation]
    skills: {squad: [reviewing-marketing, brand-contract]}
chains:
  piece:
    - {stage: research, assignee: marketing-research, skill: researching-markets, when: research}
    - {stage: copy, assignee: marketing-creative, skill: writing-copy}
    - {stage: asset, assignee: marketing-producer, skill: producing-assets}
    - {stage: review, assignee: marketing-reviewer, skill: reviewing-marketing}
    - {stage: approve, assignee: marketing}
asks: ["onboard my brand", "plan next week", "monthly report"]
