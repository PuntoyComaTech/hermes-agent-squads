schema: 2
key: web
name: Web
version: 3.0.0
hermes_requires: ">=0.22.0"
board: {slug: web, name: Web, icon: "🌐", color: "#2F6FEB"}
section: {id: web, name: Web}
manager: web
defaults: {aux_lane: aux, vision_lane: vision, cron_toolsets: [terminal, file, skills, kanban, todo]}
bots:
  web:
    role: manager
    title: Web manager
    description: "Interviews the user, writes spec.md, plans milestones, launches chains, triages and accepts"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, web, vision, delegation]
    skills: {squad: [leading-web, site-contract], auto_load: leading-web,
             keep: [official:software-development/grill-me]}
    plugins: {enable: [disk-cleanup]}
    memory: true
    cron:
      web-watch: {schedule: "0 */4 * * *", script: web_watch.py, agent: false}
  web-frontend:
    role: worker
    title: Web frontend
    description: "UI, design system, motion, scroll and three.js for the site repo"
    lane: design
    reasoning: medium
    toolsets: [file, skills, kanban, todo, terminal, vision, browser]
    skills: {squad: [building-frontend, site-contract], auto_load: building-frontend,
             keep: [official:creative/impeccable, bundled:claude-design]}
    plugins: {enable: [disk-cleanup, security-guidance], disable: []}
    mcp: {context7: {command: npx, args: [-y, "@upstash/context7-mcp"]}}
    connectors: {enabled: false, suggest: []}
    passthrough: []
    delegation: {lane: null}
    memory: false
  web-backend:
    role: worker
    title: Web backend
    description: "APIs, data, auth and tests; consults the advisor on data model, auth and migrations"
    lane: code
    toolsets: [file, skills, kanban, todo, terminal, delegation]
    skills: {squad: [building-backend, site-contract], auto_load: building-backend,
             keep: [bundled:test-driven-development, bundled:systematic-debugging]}
    plugins: {enable: [disk-cleanup, security-guidance]}
    mcp: {context7: {command: npx, args: [-y, "@upstash/context7-mcp"]}}
    connectors: {enabled: false, suggest: [supabase, neon_mcp]}
    delegation: {lane: advisor}
    memory: false
  web-qa:
    role: worker
    title: Web QA
    description: "Five lenses on each preview: acceptance, visual, WCAG 2.2, Core Web Vitals, security and SEO"
    lane: review
    toolsets: [file, skills, kanban, todo, browser, vision, terminal, delegation]
    skills: {squad: [reviewing-sites, site-contract], auto_load: reviewing-sites,
             keep: [official:dogfood/adversarial-ux-test, bundled:requesting-code-review]}
    plugins: {enable: [disk-cleanup]}
    mcp: {chrome-devtools: {command: npx, args: [-y, "chrome-devtools-mcp@latest"]}}
    memory: false
  web-deployer:
    role: worker
    title: Web deployer
    description: "GitHub flow, preview and production deploys, DNS and rollback; the only bot with deploy credentials"
    lane: research
    toolsets: [file, skills, kanban, todo, terminal]
    skills: {squad: [deploying-sites, site-contract], auto_load: deploying-sites,
             keep: [official:web-development/publish-site, bundled:github]}
    plugins: {enable: [disk-cleanup]}
    connectors: {enabled: false, suggest: [cloudflare_mcp]}
    requires: {apps: [cf, wrangler, gh]}
    memory: false
chains:
  milestone:
    - {stage: api, assignee: web-backend, skill: building-backend, when: backend}
    - {stage: ui, assignee: web-frontend, skill: building-frontend}
    - {stage: preview, assignee: web-deployer, skill: deploying-sites}
    - {stage: qa, assignee: web-qa, skill: reviewing-sites}
    - {stage: accept, assignee: web, skill: leading-web}
asks: ["new site: <idea>", "status", "publish"]
