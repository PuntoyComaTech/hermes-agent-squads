schema: 2
key: builder
name: Builder
version: 2.0.0
hermes_requires: ">=0.22.0"
manager: builder
defaults: {aux_lane: aux, vision_lane: vision}
bots:
  builder:
    role: manager
    title: Builder
    description: "Creates, edits and maintains local Hermes squads through squadctl"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, terminal, cronjob]
    skills: {squad: [hermes-platform, installing-squads], auto_load: hermes-platform,
             keep: [bundled:hermes-agent, bundled:hermes-agent-skill-authoring]}
    plugins: {enable: [disk-cleanup]}
    memory: true
    cron:
      builder-watch:
        schedule: "0 7 * * *"
        script: watch_upstream.py
        agent: {lane: digest, skill: tracking-updates, reasoning: high}
asks: ["set me up", "add a squad", "what changed upstream"]
