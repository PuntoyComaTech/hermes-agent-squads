# Toolsets never offered to any squad bot. squadctl writes
#   disabled_toolsets = always_disabled + (MANAGED - bot toolsets)
# where bot toolsets = the base set of its role (squadctl BASE_TOOLSETS / MANAGER_TOOLSETS) + the manifest's.
# No name here may share a tool with a base toolset (tests/test_contracts.py checks it against the Hermes source):
# `search` is web_search, so disabling it stripped web search from every bot that had `web`.
# Why disabled: other messaging platforms, plugin installs without the owner (catalog), raw desktop/GUI control
# (computer_use), group-chat turns (bot_room), speech and X search no squad uses.

schema: 1
always_disabled:
  - a2a
  - bot_room
  - catalog
  - computer_use
  - context_engine
  - discord
  - discord_admin
  - feishu_doc
  - feishu_drive
  - tts
  - x_search
  - yuanbao
