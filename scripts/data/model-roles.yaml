# Lane -> model candidates, read by scripts/model_advisor.py. Overridden by <builder>/local/model-roles.yaml.
# This file and local/installed.yaml are the only places where model ids may appear (skill_lint rule model-ids).
#
# OUTPUT FORMAT (what `model_advisor.py --json` prints; consumed by `squadctl plan` and
# `squadctl apply --models`):
#   {
#     "roles": ["base", "local"],                # lane tables that were merged
#     "providers": {
#       "authenticated": [{"slug", "family", "models": [ids], "key_in": ["root"|"profile", ...],
#                          "excluded"?: true}],  # key_in = scopes where Hermes finds the key (auto
#                                                # detection only; empty when --providers cache|list)
#       "families": [...], "source": "in-process|runtime|auth-list|cache|list",
#       "stale": [slugs],                        # provider cache entries older than 7 days
#       "report": ["provider X authenticated at root but not in profile Y", ...],
#       "excluded": [slugs]                      # local/providers-exclude.txt; listed, never recommended
#     },
#     "squads": [{"key", "bots": [BotPick...], "shared": [Pick...]}],
#     "lanes": [Pick...],
#     "fallback"?: [{provider, model, reasoning}],  # only when a pick runs on a quota_limited provider
#     "fallback_reason"?: "..."
#   }
#   Pick    = {"lane", "model", "provider", "reasoning", "alternatives": [{model, provider, reasoning}x<=2],
#              "reason"}
#   BotPick = Pick + {"bot", "role", "extras": [Pick + {"use"}]}
#   `squadctl plan` keys bots by "bot" and lanes by "lane".
#
# families: model family -> provider slugs (globs over provider_models_cache.json keys) that serve it natively.
#   A family is "present" for a user when any of its providers is authenticated and not excluded.
# candidates: ordered by quality for the role, across families. The advisor picks the first candidate
#   whose `match` regex (Python re, full match) hits a model id of an authenticated provider listed in
#   `provider_pref` (default: the family's providers, in order). `reasoning` defaults to the lane's.
# fallback: what to do when no candidate matches. `cheapest` = the provider's cheapest model by a
#   name heuristic (flash, mini, haiku, nano); `first-choice-provider` = the manager lane's pick.
# cost: low | mid | high, the candidate's price class (default mid). Economical first: on a lane without
#   `critical: true`, every low or mid candidate that matches is tried before any high one, so a premium model is
#   picked only when no cheaper capable model is connected (the reason says so). A `critical: true` lane keeps the
#   quality order: the strongest model that matches wins, premium included. Mark a lane critical only when a weaker
#   model visibly fails at it.
# rule: `different-family-from-producer` (review) skips candidates of the producer lanes' families
#   whenever another family is present.
# exclusions: <builder>/local/providers-exclude.txt lists one provider slug per line; excluded
#   providers are still DETECTED (Hermes cannot disable a provider; copilot is still seen via
#   `gh auth token`) but never recommended.
# Dated 2026-10. Regexes accept "-" or "." as the version separator and the [1m] context suffix, so catalog
# renames between providers (claude-opus-5-5 vs claude-opus-5.5) do not break a lane.

schema: 2
updated: 2026-10-21

families:
  anthropic: [claude-subscription*, anthropic]
  openai: [openai-codex, openai-api, copilot, github-copilot]
  open-weights: [opencode-go, opencode, openrouter, nous]
  google: [gemini, google*]

# quota_limited: providers whose plan caps usage in time windows (subscriptions, premium-request plans). When any
#   pick lands on one, the advisor adds a top-level `fallback` chain that `squadctl apply --models` writes to every
#   bot as `fallback_providers`, `delegation.fallback_providers` and `agent.reasoning_overrides`.
quota_limited: [claude-subscription*, openai-codex, copilot, github-copilot, opencode-go, xai-oauth]

# fallback_chain: candidates in order, picked like a lane. Providers outside the quota-limited primaries come
#   first; a model the primaries already use is never a fallback. `size` = chain length.
fallback_chain:
  why: "Keeps every bot working when its subscription window runs out: a strong model first, then a cheap one"
  size: 2
  candidates:
    - {cost: mid, family: anthropic, match: 'claude-sonnet-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
    - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: high}
    - {cost: mid, family: open-weights, match: 'mimo-v2\.6-pro', reasoning: high}
    - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: xhigh, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
    - {cost: low, family: open-weights, match: 'deepseek-v4\.1-flash', reasoning: high}
    - {cost: low, family: google, match: 'gemini-\d+(\.\d+)?-flash', reasoning: high}

lanes:
  manager:
    why: "Planning, interviewing and accepting work: judgment and instruction following matter more than speed"
    used_by: [squad managers, planner bots]
    reasoning: medium
    candidates:
      - {cost: high, family: anthropic, match: 'claude-opus-5[.-]5(\[1m\])?', reasoning: medium, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: mid, family: anthropic, match: 'claude-sonnet-5[.-]5(\[1m\])?', reasoning: medium, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: medium}
      - {cost: high, family: google, match: 'gemini-3\.1-pro(-preview)?', reasoning: medium}
      - {cost: mid, family: open-weights, match: 'mimo-v2\.6-pro', reasoning: high}
      - {cost: mid, family: open-weights, match: 'glm-5\.3', reasoning: high}
    fallback: cheapest

  frontend:
    why: "UI quality is model-bound and pays per pixel: strong UI models at high effort"
    used_by: [web-frontend, marketing-producer]
    reasoning: high
    candidates:
      - {cost: high, family: anthropic, match: 'claude-opus-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: mid, family: anthropic, match: 'claude-sonnet-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: high}
      - {cost: high, family: google, match: 'gemini-3\.1-pro(-preview)?', reasoning: high}
      - {cost: mid, family: open-weights, match: 'kimi-k3', reasoning: high}
      - {cost: mid, family: open-weights, match: 'glm-5\.3', reasoning: high}
    fallback: first-choice-provider

  design-pro:
    why: "Frontier models for 3D/WebGL and complex motion where weaker models visibly fail"
    critical: true
    used_by: [web-frontend-pro]
    reasoning: high
    candidates:
      - {cost: high, family: anthropic, match: 'claude-opus-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: high}
      - {cost: high, family: google, match: 'gemini-3\.1-pro(-preview)?', reasoning: high}
      - {cost: mid, family: open-weights, match: 'mimo-v2\.6-pro', reasoning: xhigh}
      - {cost: mid, family: open-weights, match: 'kimi-k3', reasoning: high}
    fallback: first-choice-provider

  code-complex:
    why: "Architecture, auth, data models and migrations: strongest reasoning, xhigh where the model supports it"
    critical: true
    used_by: [web-backend delegation, hard-problem advisors]
    reasoning: xhigh
    candidates:
      - {cost: high, family: anthropic, match: 'claude-opus-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: mid, family: open-weights, match: 'mimo-v2\.6-pro', reasoning: xhigh}
      - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: high}
      - {cost: high, family: google, match: 'gemini-3\.1-pro(-preview)?', reasoning: high}
      - {cost: mid, family: anthropic, match: 'claude-sonnet-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
    fallback: first-choice-provider

  code-routine:
    why: "CRUD, tests and small fixes are long tool loops: fast cheap coders at high effort"
    used_by: [web-backend]
    reasoning: high
    candidates:
      - {cost: low, family: open-weights, match: 'deepseek-v4\.1-flash', reasoning: high}
      - {cost: low, family: open-weights, match: 'kimi-k2\.7-code', reasoning: high}
      - {cost: mid, family: open-weights, match: 'glm-5\.3', reasoning: high}
      - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: low, family: openai, match: 'gpt-5\.\d+-mini', reasoning: high}
      - {cost: low, family: google, match: 'gemini-\d+(\.\d+)?-flash', reasoning: high}
    fallback: first-choice-provider

  review:
    why: "Independent review catches more when the reviewer's model family differs from the producers'"
    critical: true
    used_by: [web-qa, marketing-reviewer, jobs-reviewer]
    reasoning: high
    rule: different-family-from-producer   # prefer a family different from the frontend/code picks
    candidates:
      - {cost: high, family: anthropic, match: 'claude-opus-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: mid, family: open-weights, match: 'mimo-v2\.6-pro', reasoning: xhigh}
      - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: high}
      - {cost: high, family: google, match: 'gemini-3\.1-pro(-preview)?', reasoning: high}
      - {cost: mid, family: anthropic, match: 'claude-sonnet-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
    fallback: first-choice-provider

  deploy:
    why: "Deploy runs are frequent and mechanical: cheapest capable executor at high effort"
    used_by: [web-deployer]
    reasoning: high
    candidates:
      - {cost: low, family: open-weights, match: 'deepseek-v4\.1-flash', reasoning: high}
      - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: low, family: openai, match: 'gpt-5\.\d+-mini', reasoning: high}
      - {cost: low, family: google, match: 'gemini-\d+(\.\d+)?-flash', reasoning: high}
    fallback: cheapest

  research:
    why: "Web sweeps are high-volume and low-judgment; cheapest capable model"
    used_by: [marketing-research, jobs-scout]
    reasoning: medium
    candidates:
      - {cost: low, family: open-weights, match: 'deepseek-v4\.1-flash', reasoning: medium}
      - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: low, family: openai, match: 'gpt-5\.\d+-mini', reasoning: high}
      - {cost: low, family: google, match: 'gemini-\d+(\.\d+)?-flash', reasoning: high}
    fallback: cheapest

  digest:
    why: "The daily upstream digest reads filtered release notes and writes JSON; cheap model, high effort"
    used_by: [builder update cron]
    reasoning: high
    candidates:
      - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: high, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: low, family: open-weights, match: 'deepseek-v4\.1-flash', reasoning: high}
      - {cost: low, family: openai, match: 'gpt-5\.\d+-mini', reasoning: high}
      - {cost: low, family: google, match: 'gemini-\d+(\.\d+)?-flash', reasoning: high}
    fallback: cheapest

  aux:
    why: "auxiliary.* slots (compression, titles, summaries) run on every session; cheapest model, low effort"
    used_by: [all auxiliary.* slots]
    reasoning: low
    candidates:
      - {cost: low, family: open-weights, match: 'deepseek-v4\.1-flash', reasoning: low}
      - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: low, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: low, family: openai, match: 'gpt-5\.\d+-mini', reasoning: low}
      - {cost: low, family: google, match: 'gemini-\d+(\.\d+)?-flash', reasoning: low}
    fallback: cheapest

  vision:
    why: "auxiliary.vision for text-only main models; must accept images"
    used_by: [auxiliary.vision]
    reasoning: low
    candidates:
      - {cost: mid, family: open-weights, match: 'mimo-v2\.6-pro', reasoning: low}
      - {cost: low, family: anthropic, match: 'claude-haiku-5[.-]5(\[1m\])?', reasoning: low, provider_pref: [claude-subscription*, anthropic, copilot, github-copilot, openrouter]}
      - {cost: high, family: google, match: 'gemini-3\.1-pro(-preview)?', reasoning: low}
      - {cost: high, family: openai, match: 'gpt-5\.4', reasoning: low}
    fallback: first-choice-provider

