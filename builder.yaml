# The builder bot (squad-bot schema, squads/_schema/squad.schema.json). Applied by `scripts/squadctl apply --self`.
# The profile itself comes from `hermes profile install`; apply --self sets the model and lanes (from
# local/installed.yaml), skills, plugins, ui_meta and the builder-update and builder-watch crons. No board: the builder files no cards.
schema: 2
key: builder
name: Builder
description: "Creates, edits and maintains local Hermes squads"
hermes_requires: ">=0.22.0"
manager: builder
defaults: {aux_lane: aux, vision_lane: vision}
bots:
  builder:
    role: manager
    title: Builder
    description: "Creates, edits and maintains local Hermes squads through squadctl"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, terminal, cronjob]
    skills:
      squad: [hermes-platform, designing-squads, installing-squads, assigning-models, managing-projects,
              changing-bots, authoring-skills, finding-capabilities, tracking-updates, contributing-upstream]
      auto_load: hermes-platform
      keep: [bundled:hermes-agent, bundled:hermes-agent-skill-authoring]
    plugins: {enable: [disk-cleanup]}
    memory: true
    cron:
      builder-update:
        schedule: "30 6 * * *"
        script: auto_update.py
        agent: false
      builder-watch:
        schedule: "0 7 * * *"
        script: watch_upstream.py
        args: [--skip-squads]
        agent: {lane: digest, skill: tracking-updates, reasoning: high}
asks: ["set me up", "add a squad", "change a bot", "update yourself", "what changed upstream"]
