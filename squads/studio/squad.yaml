schema: 2
key: studio
name: Studio
description: "Motion graphics, rendered video and 3D assets for the web and marketing squads"
version: 1.1.0
hermes_requires: ">=0.22.0"
board: {slug: studio, name: Studio, icon: "🎬", color: "#7048E8", description: "Rendered assets: motion graphics, MP4/WebM, 3D renders, glTF, WebGL demos"}
section: {id: studio, name: Studio}
manager: studio
defaults: {aux_lane: aux, vision_lane: vision}
bots:
  studio:
    role: manager
    title: Studio manager
    description: "Brief to storyboard and shot list, chains the work, reviews renders, delivers to the requester"
    lane: design
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, vision, web, delegation]
    skills:
      squad: [directing-studio, studio-contract]
      auto_load: directing-studio
      keep: [official:creative/creative-ideation]
    plugins: {enable: [disk-cleanup]}
    memory: true
    cron:
      studio-watch: {schedule: "*/30 * * * *", script: board_watch.py, agent: false}
  studio-motion:
    role: worker
    title: Studio motion
    description: "Remotion, HyperFrames, GSAP, three.js/R3F, Manim and p5.js renders, checked with render_check.py"
    lane: design
    toolsets: [file, skills, kanban, todo, terminal, vision, browser, video, image_gen, delegation]
    skills:
      squad: [producing-motion, studio-contract]
      auto_load: producing-motion
      keep:
        - id: hub:skills-sh/remotion-dev/skills/remotion-best-practices
          confirm: "Remotion needs a paid company licence for companies with 4 or more employees; it is free for individuals and smaller companies. Confirm which one applies before installing."
        - official:creative/hyperframes
        - official:creative/auteur
        - official:creative/dream-loop
        - bundled:manim-video
        - bundled:p5js
    plugins:
      enable:
        - disk-cleanup
        - security-guidance
        - name: hermes-video-editor
          confirm: "hermes-video-editor is PolyForm Noncommercial 1.0.0: free for non-commercial use, commercial use needs a separate licence from the author. Install only after the user confirms the use."
    mcp: {context7: {url: "https://mcp.context7.com/mcp"}}
  studio-3d:
    role: worker
    title: Studio 3D
    description: "Blender scenes, materials, lighting, Cycles and EEVEE renders, turntables, glTF"
    lane: design
    toolsets: [file, skills, kanban, todo, terminal, vision]
    skills: {squad: [rendering-3d, studio-contract], auto_load: rendering-3d}
    plugins:
      enable:
        - disk-cleanup
        - name: blender
          confirm: "The blender plugin runs arbitrary Python inside Blender with the user's privileges and needs Blender 5.1+, its MCP add-on and uv. Install only after the user's OK."
    requires: {apps: [blender>=5.1, uv, git]}
chains:
  piece:
    - {stage: 3d, assignee: studio-3d, skill: rendering-3d, when: needs_3d}
    - {stage: motion, assignee: studio-motion, skill: producing-motion}
    - {stage: review, assignee: studio, skill: directing-studio}
asks: ["hero loop for <site>", "turntable of <model>", "status"]
