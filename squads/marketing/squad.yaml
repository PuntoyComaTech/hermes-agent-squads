schema: 2
key: marketing
name: Marketing
description: "Brand onboarding, 90-day plans, weekly calendars and reviewed marketing pieces for several brands"
version: 3.3.0
hermes_requires: ">=0.22.0"
board: {slug: marketing, name: Marketing, icon: "📣", color: "#D9480F", description: "Brand plans, weekly calendars and reviewed pieces"}
section: {id: marketing, name: Marketing}
manager: marketing
defaults: {aux_lane: aux, vision_lane: vision, cron_toolsets: [file, skills, kanban, todo]}
bots:
  marketing:
    role: manager
    title: Marketing manager
    description: "Brand onboarding, 90-day plan, calendar, briefs, approvals and reports"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, web, vision, delegation]
    skills:
      squad: [leading-marketing, brand-contract, marketing-plan, product-marketing, marketing-council, marketing-mindset]
      auto_load: leading-marketing
      keep: [official:creative/social-media-content-calendar, official:productivity/decision-questionnaire]
    plugins: {enable: [disk-cleanup]}
    connectors: {enabled: false, suggest: []}
    memory: true
    cron:
      marketing-plan-week: {schedule: "0 8 * * 1", script: plan_week.py, agent: false}
      marketing-report: {schedule: "0 8 1 * *", script: report_gate.py, agent: false}
      marketing-watch: {schedule: "*/30 * * * *", script: board_watch.py, agent: false}
      marketing-awake: {schedule: "*/4 * * * *", script: keep_awake.py, agent: false}
      marketing-projects: {schedule: "*/10 * * * *", script: project_sync.py, agent: false}
  marketing-research:
    role: worker
    title: Marketing research
    description: "Dated market, competitor and ad-library evidence"
    lane: research
    toolsets: [file, skills, kanban, todo, web, browser, terminal]
    shared_browser: true   # the machine's one signed-in browser, one tab per run
    skills:
      squad: [researching-markets, brand-contract]
      auto_load: researching-markets
      keep: [bundled:competitor-news-monitor, bundled:blocked-page-recovery, official:social-media/reddit-reading]
    plugins: {enable: [disk-cleanup]}
    connectors: {enabled: false, suggest: []}
  marketing-creative:
    role: worker
    title: Marketing creative
    description: "Concepts, all copy and scripts; no web access"
    lane: manager
    toolsets: [file, skills, kanban, todo, vision]
    withhold: [web]
    skills:
      squad: [writing-copy, brand-contract, marketing-psychology]
      auto_load: writing-copy
      keep: [bundled:humanizer]
    plugins: {enable: [disk-cleanup]}
    connectors: {enabled: false, suggest: [notion]}
  marketing-producer:
    role: worker
    title: Marketing producer
    description: "Statics, carousels, landings, emails, documents and short HyperFrames clips"
    lane: design-pro
    toolsets: [file, skills, kanban, todo, terminal, vision, image_gen, browser]
    shared_browser: true   # the machine's one signed-in browser, one tab per run
    skills:
      squad: [producing-assets, brand-contract]
      auto_load: producing-assets
      keep: [bundled:claude-design, bundled:design-md, official:creative/impeccable, official:creative/hyperframes]
    plugins: {enable: [disk-cleanup, security-guidance]}
    connectors: {enabled: false, suggest: []}
  marketing-reviewer:
    role: worker
    title: Marketing reviewer
    description: "Five lenses: brief fit, voice, claims, persuasion and format specs"
    lane: review
    toolsets: [file, skills, kanban, todo, vision, delegation]
    skills: {squad: [reviewing-marketing, brand-contract], auto_load: reviewing-marketing}
    plugins: {enable: [disk-cleanup]}
chains:
  piece:
    - {stage: research, assignee: marketing-research, skill: researching-markets, when: research}
    - {stage: copy, assignee: marketing-creative, skill: writing-copy}
    - {stage: asset, assignee: marketing-producer, skill: producing-assets}
    - {stage: review, assignee: marketing-reviewer, skill: reviewing-marketing}
    - {stage: approve, assignee: marketing, skill: leading-marketing}
asks: ["onboard my brand", "plan next week", "make a piece: <idea>", "monthly report", "status"]
