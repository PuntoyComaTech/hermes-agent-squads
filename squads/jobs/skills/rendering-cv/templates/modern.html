<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
/* ATS-safe, single column, sans-serif with one accent colour for section headings. No tables, images or columns. */
@page { size: {{PAGE_SIZE}}; margin: 15mm 17mm; }
html { font-family: "Helvetica Neue", Arial, Helvetica, sans-serif; font-size: 10pt; line-height: 1.4; color: #222; }
body { margin: 0; }
header.top { margin-bottom: 6pt; }
h1.name { font-size: 22pt; line-height: 1.1; margin: 0 0 2pt; font-weight: bold; color: #0b3d6e; }
p.headline { margin: 0 0 2pt; font-size: 11pt; color: #333; }
p.contact, p.links { margin: 0; font-size: 9pt; color: #444; }
h2 { font-size: 12.5pt; margin: 12pt 0 4pt; font-weight: bold; color: #0b5cad; break-after: avoid; page-break-after: avoid; }
h3 { font-size: 10.5pt; margin: 6pt 0 0; font-weight: bold; break-after: avoid; page-break-after: avoid; }
h3 .org { font-weight: normal; color: #444; }
p { margin: 0 0 4pt; orphans: 2; widows: 2; }
p.dates, p.url { margin: 0 0 2pt; font-size: 9pt; color: #555; }
p.gap { font-style: italic; }
p.refline { font-size: 9pt; color: #555; }
ul { margin: 0 0 4pt; padding-left: 14pt; }
li { margin: 0 0 2pt; break-inside: avoid; page-break-inside: avoid; }
article { margin: 0 0 4pt; }
a { color: #0b5cad; text-decoration: none; }
.letter p.body { margin-bottom: 8pt; }
.letter p.salutation, .letter p.closing { margin-top: 10pt; }
.letter p.signature { margin: 0; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
