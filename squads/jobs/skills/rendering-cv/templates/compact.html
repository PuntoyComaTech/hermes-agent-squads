<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
/* ATS-safe, single column, dense. Use when the content must fit a tight page budget. No tables for layout. */
@page { size: {{PAGE_SIZE}}; margin: 12mm 13mm; }
html { font-family: Arial, Helvetica, sans-serif; font-size: 9.5pt; line-height: 1.3; color: #111; }
body { margin: 0; }
header.top { margin-bottom: 3pt; }
h1.name { font-size: 16pt; line-height: 1.15; margin: 0 0 1pt; font-weight: bold; }
p.headline { margin: 0 0 1pt; font-weight: bold; color: #333; }
p.contact, p.links { margin: 0; font-size: 8.5pt; color: #333; }
h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: 0.5pt; margin: 8pt 0 3pt; padding-bottom: 1pt;
     border-bottom: 0.75pt solid #222; break-after: avoid; page-break-after: avoid; }
h3 { font-size: 9.5pt; margin: 4pt 0 0; font-weight: bold; break-after: avoid; page-break-after: avoid; }
h3 .org { font-weight: normal; }
p { margin: 0 0 3pt; orphans: 2; widows: 2; }
p.dates, p.url { margin: 0 0 1pt; font-size: 8.5pt; color: #444; }
p.gap { font-style: italic; }
p.refline { font-size: 8.5pt; color: #444; }
ul { margin: 0 0 3pt; padding-left: 12pt; }
li { margin: 0 0 1.5pt; break-inside: avoid; page-break-inside: avoid; }
article { margin: 0 0 3pt; }
a { color: #111; text-decoration: underline; }
.letter p.body { margin-bottom: 6pt; }
.letter p.salutation, .letter p.closing { margin-top: 8pt; }
.letter p.signature { margin: 0; }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
