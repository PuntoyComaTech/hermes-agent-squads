schema: 2
key: jobs
name: Jobs
description: "Personalised job search: finds, ranks and analyzes openings, writes, reviews, applies and tracks tailored applications"
version: 4.12.0

hermes_requires: ">=0.22.0"
board: {slug: jobs, name: Jobs, icon: "💼", color: "#2B8A3E", description: "Job search: search, rank, analysis, CV, review, apply, follow-up"}
section: {id: jobs, name: Jobs}
manager: jobs
defaults: {aux_lane: aux, vision_lane: vision, cron_toolsets: [terminal, file, skills, kanban, todo]}
bots:
  jobs:
    role: manager
    title: Jobs manager
    description: "Profile onboarding, digests, apply or skip decisions, outcomes, upskilling and the dashboard; holds PII, no web"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo, terminal]
    skills:
      squad: [leading-job-search, profiling-candidates, tracking-outcomes, planning-upskilling, jobs-contract]
      auto_load: leading-job-search
    plugins: {enable: [disk-cleanup]}
    memory: true
    cron:
      jobs-search: {schedule: "0 * * * *", script: start_search.py, agent: false, notify: true}   # hourly; the gate picks the slot
      jobs-followups: {schedule: "0 9 * * 1-5", script: followup_gate.py, agent: false, notify: true}
      jobs-watch: {schedule: "*/30 * * * *", script: board_watch.py, agent: false, notify: true}
      jobs-notices: {schedule: "15 * * * *", script: application_notices.py, agent: false, notify: true}  # hourly: each sent application in its own message, CV attached
      jobs-awake: {schedule: "*/4 * * * *", script: keep_awake.py, agent: false}
      jobs-projects: {schedule: "*/10 * * * *", script: project_sync.py, agent: false}
  jobs-scout:
    role: worker
    title: Jobs scout
    description: "Searches portals, LinkedIn hiring posts and career pages, gates and ranks openings, writes PURSUE/WATCH/REJECT analyses"
    lane: research
    toolsets: [file, skills, kanban, todo, web, browser, delegation]
    shared_browser: true   # the signed-in browser: LinkedIn hiring posts, read-only
    skills:
      squad: [finding-jobs, searching-portals, adding-portals, browsing-linkedin, recommending-platforms, ranking-openings,
              analyzing-jobs, jobs-contract]
      keep: [bundled:blocked-page-recovery]
    plugins: {enable: [disk-cleanup]}
    # The shared browser is signed in to Google. Its service cannot resolve these hosts at all; this list only
    # catches URLs written literally in a browser_exec call.
    website_blocklist: &google_private [mail.google.com, drive.google.com, docs.google.com, myaccount.google.com,
                                        pay.google.com, photos.google.com, calendar.google.com, contacts.google.com]
    requires: {apps: [bun]}
  jobs-writer:
    role: worker
    title: Jobs writer
    description: "CV, letter, answers and interview prep from verified achievements; renders PDF and DOCX; optimises the user's own LinkedIn profile"
    lane: manager
    toolsets: [file, skills, kanban, todo, terminal, browser]
    shared_browser: true   # the user's own LinkedIn profile only (optimizing-profiles)
    withhold: [web]
    skills:
      squad: [writing-applications, optimizing-profiles, rendering-cv, preparing-interviews, jobs-contract]
      keep: [bundled:humanizer, bundled:docx, bundled:pdf]
    plugins: {enable: [disk-cleanup]}
    website_blocklist: *google_private
  jobs-reviewer:
    role: worker
    title: Jobs reviewer
    description: "Six-lens review of every application before the digest; verifies company claims itself"
    lane: review
    toolsets: [file, skills, kanban, todo, delegation, terminal, web]
    # Lens children judge truthfulness: they run on the review model, not the research lane. A review is five lens
    # children plus a re-run of any malformed one, in one kanban run (Hermes's one-shot default is 2 children).
    delegation: {lane: review, max_children: 12}
    skills: {squad: [reviewing-applications, rendering-cv, jobs-contract]}
    plugins: {enable: [disk-cleanup]}
  jobs-applier:
    role: worker
    title: Jobs applier
    description: "Submits approved applications within the user's apply mode and daily caps, LinkedIn Easy Apply included; otherwise prepares a manual kit"
    lane: manager
    toolsets: [file, skills, kanban, todo, browser, terminal]
    shared_browser: true
    skills: {squad: [submitting-applications, jobs-contract]}
    plugins: {enable: [disk-cleanup]}
    website_blocklist: *google_private
  jobs-inbox:
    role: worker
    title: Jobs inbox
    description: "Reads job mail through the Gmail connector: replies, follow-up drafts and verification codes; no web, no browser"
    lane: digest
    optional: true   # needs a Gmail connector account: squadctl apply jobs --with jobs-inbox
    toolsets: [file, skills, kanban, todo, terminal, connections]
    withhold: [web, delegation, code_execution]
    skills: {squad: [triaging-inbox, jobs-contract]}
    plugins: {enable: [disk-cleanup]}
    connectors: {enabled: true, suggest: [gmail]}
chains:
  application:
    - {stage: analyze, assignee: jobs-scout, skill: analyzing-jobs, lane: review}
    - {stage: write, assignee: jobs-writer, skill: writing-applications}
    - {stage: review, assignee: jobs-reviewer, skill: reviewing-applications}
    - {stage: digest, assignee: jobs, skill: leading-job-search}
  profile:
    - {stage: platforms, assignee: jobs-scout, skill: recommending-platforms}
    - {stage: market, assignee: jobs-scout, skill: browsing-linkedin}
    - {stage: optimize, assignee: jobs-writer, skill: optimizing-profiles}
    - {stage: present, assignee: jobs, skill: leading-job-search}
asks: ["set up my profile", "<job link>", "rank my openings", "apply to <id>", "any replies?", "show my pipeline",
       "what should I learn?", "optimize my LinkedIn", "which job sites fit my city?", "pause search"]
