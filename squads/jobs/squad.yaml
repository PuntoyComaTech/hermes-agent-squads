schema: 2
key: jobs
name: Jobs
description: "Finds openings, filters and analyzes them, writes and reviews tailored applications"
version: 3.1.1
hermes_requires: ">=0.22.0"
board: {slug: jobs, name: Jobs, icon: "💼", color: "#2B8A3E", description: "Job search: search, analysis, CV, review, apply"}
section: {id: jobs, name: Jobs}
manager: jobs
defaults: {aux_lane: aux, vision_lane: vision, cron_toolsets: [terminal, file, skills, kanban, todo]}
bots:
  jobs:
    role: manager
    title: Jobs manager
    description: "Profile interview, digests, apply or skip decisions and tracking; holds PII, no web"
    lane: manager
    toolsets: [file, skills, kanban, memory, session_search, clarify, todo]
    skills: {squad: [leading-job-search, jobs-contract], auto_load: leading-job-search}
    plugins: {enable: [disk-cleanup]}
    memory: true
    cron:
      jobs-search: {schedule: "0 8,15 * * *", script: start_search.py, agent: false}
      jobs-watch: {schedule: "*/30 * * * *", script: board_watch.py, agent: false}
      jobs-awake: {schedule: "*/4 * * * *", script: keep_awake.py, agent: false}
      jobs-projects: {schedule: "*/10 * * * *", script: project_sync.py, agent: false}
  jobs-scout:
    role: worker
    title: Jobs scout
    description: "Searches openings, applies the hard filter, writes PURSUE/WATCH/REJECT analysis cards"
    lane: research
    toolsets: [file, skills, kanban, todo, web, browser, delegation]
    skills: {squad: [finding-jobs, analyzing-jobs, jobs-contract], keep: [bundled:blocked-page-recovery]}
    plugins: {enable: [disk-cleanup]}
    website_blocklist: [linkedin.com]
  jobs-writer:
    role: worker
    title: Jobs writer
    description: "CV, letter and answers from verified achievements; renders PDF and DOCX"
    lane: manager
    toolsets: [file, skills, kanban, todo, terminal]
    withhold: [web]
    skills:
      squad: [writing-applications, rendering-cv, preparing-interviews, jobs-contract]
      keep: [bundled:humanizer, bundled:docx, bundled:pdf]
    plugins: {enable: [disk-cleanup]}
  jobs-reviewer:
    role: worker
    title: Jobs reviewer
    description: "Five-lens review of every application before the digest"
    lane: review
    toolsets: [file, skills, kanban, todo, delegation]
    skills: {squad: [reviewing-applications, jobs-contract]}
    plugins: {enable: [disk-cleanup]}
  jobs-applier:
    role: worker
    title: Jobs applier
    description: "Submits simple forms only after the user's apply; otherwise prepares a manual kit"
    lane: manager
    toolsets: [file, skills, kanban, todo, browser]
    skills: {squad: [submitting-applications, jobs-contract]}
    plugins: {enable: [disk-cleanup]}
    website_blocklist: [linkedin.com]
chains:
  application:
    - {stage: analyze, assignee: jobs-scout, skill: analyzing-jobs, lane: review}
    - {stage: write, assignee: jobs-writer, skill: writing-applications}
    - {stage: review, assignee: jobs-reviewer, skill: reviewing-applications}
    - {stage: digest, assignee: jobs, skill: leading-job-search}
asks: ["set up my profile", "<job link>", "apply to <id>", "how is my search going?", "pause search"]
