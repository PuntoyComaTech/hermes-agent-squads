# Written by site_base.py. pre-commit formats and lints what is being committed (progress commits included), runs
# the per-file ratchet (zero findings and zero comments on a new file; a touched file never exceeds its baseline),
# the tests related to the staged files and the repo-wide regression check (totals never grow). pre-push runs the
# whole gate, so nothing that fails it reaches GitHub.
pre-commit:
  jobs:
    - name: biome
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css,astro}"
      run: pnpm exec biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: ratchet
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: node tools/quality/ratchet.mjs check {staged_files}
    - name: related-tests
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm exec vitest related --run {staged_files}
    - name: regressions
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css}"
      run: node tools/quality/regressions.mjs check
pre-push:
  jobs:
    - name: quality
      run: pnpm quality
