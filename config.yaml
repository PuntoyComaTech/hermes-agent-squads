# Bootstrap config: copied on `hermes profile install`, kept on `hermes profile update` (unless --force-config).
# No model block: `hermes -p builder model` picks it. `squadctl apply --self` rewrites these keys from builder.yaml.
platform_toolsets:
  cli: [clarify, cronjob, file, kanban, memory, session_search, skills, terminal, todo]
  cron: [terminal, file, skills, kanban, todo]
agent:
  disabled_toolsets: [a2a, bot_room, browser, catalog, code_execution, computer_use, connections, context_engine,
                      delegation, desktop_ui, discord, discord_admin, feishu_doc, feishu_drive, image_gen, project,
                      search, tts, video, video_gen, vision, web, x_search, yuanbao]
skills:
  auto_load: [hermes-platform]
memory:
  memory_enabled: true
  user_profile_enabled: true
